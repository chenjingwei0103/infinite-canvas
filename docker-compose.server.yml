services:
  app:
    image: ghcr.io/chenjingwei0103/infinite-canvas:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infinite-canvas
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "3010:3000"
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
